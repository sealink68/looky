<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#4f46e5">

<meta name="apple-mobile-web-app-title" content="Looky">

<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <img src="icons/dormakaba-logo.svg" alt="dormakaba" class="logo">

  <span id="off" class="off" data-t="offline" hidden></span>
  <div id="lang" class="seg"><button type="button" data-l="nl">NL</button><button type="button" data-l="fr">FR</button></div>
  <button type="button" id="btnHelp" class="sm" data-t="help"></button>
</header>
<main>
  <section class="card" id="idx">
    <h2 data-t="idxH"></h2>
    <p id="idxNone" data-t="idxNone"></p>
    <div id="idxList"></div>
    <div class="row">
      <button type="button" id="btnUpdate" data-t="idxUpdate"></button>
      <button type="button" id="btnLoad" data-t="idxLoad"></button>
      <input type="file" id="file" accept=".json,application/json" multiple hidden>
    </div>
    <p id="msg" class="msg" role="status"></p>
  </section>
  <form class="card" id="f" autocomplete="off">
    <div class="exts">
      <span data-t="ftype"></span>
      <div class="row" id="extQuick">
        <button type="button" id="extParam" data-t="tParam"></button>
        <button type="button" id="extOffice" data-t="tOffice"></button>
        <button type="button" id="extAll" data-t="tAll"></button>
        <button type="button" id="clear" class="sec" data-t="clear"></button>
      </div>
      <div id="extBoxes" class="ticks" hidden></div>
    </div>
    <label class="q"><span data-t="q"></span><div class="cb"><input id="q" data-ph="phQ" type="search"></div></label>
  </form>
  <section class="card"><p id="count"></p><ul id="res"></ul></section>
</main>
<div id="help" class="modal" hidden><div class="mbox"><button type="button" id="helpClose" class="sm" data-t="close"></button><div id="helpBody"></div></div></div>
<script src="js/config.js"></script>
<script src="js/families.js"></script>
<script src="js/store.js"></script>
<script src="js/core.js"></script>
<script src="js/combo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
